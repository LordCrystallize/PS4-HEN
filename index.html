<!doctype html>
<html class="landing" lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Crystallize</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="brand"><b>Crystallize</b></div>

    <div class="shell">

      <main class="panel">
        <p class="lede">PS4 firmware 12.00 &ndash; 14.02</p>

        <form class="pick" id="pick">
          <label class="opt">
            <input type="radio" name="payload" value="hen" />
            <span>PS4 HEN</span>
          </label>
          <label class="opt">
            <input type="radio" name="payload" value="goldhen" checked />
            <span>GoldHEN</span>
          </label>

          <label class="opt opt-auto">
            <input type="checkbox" id="auto" checked />
            <span>Autostart</span>
          </label>

          <button class="btn" type="submit">Start</button>
          <p class="count" id="count"></p>
          <p class="count" id="cache" aria-live="polite"></p>
        </form>
      </main>
    </div>

    <p class="byline">by Crystallize</p>
    <script src="launch.js"></script>
  </body>
</html>
